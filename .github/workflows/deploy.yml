name: Deploy Cloud Resume

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::557690601721:role/github-actions-cloud-resume
          aws-region: us-east-1

      - name: Package Lambda
        run: zip -j lambda/lambda_function.zip lambda/lambda_function.py

      - name: Deploy Lambda
        run: |
          aws lambda update-function-code \
            --function-name cloud-resume-counter \
            --zip-file fileb://lambda/lambda_function.zip

  deploy-frontend:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::557690601721:role/github-actions-cloud-resume
          aws-region: us-east-1

      - name: Sync S3
        run: aws s3 sync ./website s3://janna-cloud --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E2HNG4M70WIKVE \
            --paths "/*"

