name: Deploy Cloud Resume

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::557690601721:role/github-actions-cloud-resume
          aws-region: us-east-1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: pip install pytest boto3

      - name: Run tests
        run: pytest lambda/tests/ -v

      - name: Package Lambda
        run: zip -j lambda/lambda_function.zip lambda/lambda_function.py

      - name: Deploy Lambda
        run: |
          aws lambda update-function-code \
            --function-name cloud-resume-counter \
            --zip-file fileb://lambda/lambda_function.zip

  deploy-frontend:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::557690601721:role/github-actions-cloud-resume
          aws-region: us-east-1

      - name: Sync S3
        run: aws s3 sync . s3://janna-cloud --delete --exclude "*" --include "*.html" --include "*.css" --include "*.js"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E2HNG4M70WIKVE \
            --paths "/*"

